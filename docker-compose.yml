# Docker Compose — app + SQLite volume on ./data (brief §13).
#
#   1. cp .env.example .env   (set a REAL SECRET_KEY, ENVIRONMENT=prod optional)
#   2. docker compose up -d --build
#   3. docker compose exec app python -m app.create_admin admin1 you@example.com
#
# The ./data volume keeps the SQLite DB and the per-user challenge files
# across container restarts. To move to PostgreSQL instead, set
# DATABASE_URL in .env to postgresql+psycopg://... and uncomment the db
# service below (psycopg installed via requirements-extras when needed).

services:
  app:
    build: .
    container_name: bytebatallion
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data

