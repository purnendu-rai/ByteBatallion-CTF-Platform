{% extends "base.html" %}
{% block title %}Reset password — BYTE_BATALLION_CTF_PLATFORM{% endblock %}
{% block content %}
<section class="card auth-card">
  <h1>Choose a new password</h1>
  <p class="muted">Resetting the password for <b>{{ username }}</b>.</p>
  {% if error %}
    <ul class="errors"><li>{{ error }}</li></ul>
  {% endif %}
  <form method="post" action="/auth/reset-password">
    <input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}">
    <input type="hidden" name="token" value="{{ token }}">
    <label>New password (min 8 characters)
      <input type="password" name="password" required minlength="8" maxlength="128">
    </label>
    <label>Confirm new password
      <input type="password" name="password_confirm" required minlength="8" maxlength="128">
    </label>
    <button type="submit">Reset password</button>
  </form>
  <p class="muted"><a href="/auth/login">Back to log in</a></p>
</section>
{% endblock %}
